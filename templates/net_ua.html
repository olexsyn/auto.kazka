{% extends "base.html" %}

{% block title %}User Agent Info{% endblock %}

{% block head %}
<style>
  .home-wrapper {
    max-width: 1000px;
    margin: 3rem auto;
    padding: 0 1rem;
  }

  .home-section-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 1rem;
    margin-top: 2rem;
  }

  .home-field {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .home-field input {
    flex: 1;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    padding: 0.55rem 1rem;
    font-size: 0.95rem;
    color: #222;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s;
  }

  .home-field input:focus {
    outline: none;
    border-color: #aaa;
    background: #fff;
  }

  .home-field input[readonly] {
    color: #555;
    cursor: default;
  }

  .divider {
    border: none;
    border-top: 1px solid #efefef;
    margin: 2rem 0 0;
  }
</style>
{% endblock %}

{% block content %}
<div class="home-wrapper">

  <div class="home-section-title">IP</div>
  <div class="home-field">
    <input type="email" value="{{ fields['REMOTE_ADDR'] }}" readonly>
  </div>

  <div class="home-section-title">Port</div>
  <div class="home-field">
    <input type="email" value="{{ fields['REMOTE_PORT'] }}" readonly>
  </div>

  <div class="home-section-title">X_FORWARDED_FOR</div>
  <div class="home-field">
    <input type="email" value="{{ fields['X_FORWARDED_FOR'] }}" readonly>
  </div>

  <div class="home-section-title">X_REAL_IP</div>
  <div class="home-field">
    <input type="email" value="{{ fields['X_REAL_IP'] }}" readonly>
  </div>

  <div class="home-section-title">USER_AGENT</div>
  <div class="home-field">
    <input type="email" value="{{ fields['USER_AGENT'] }}" readonly>
  </div>

  <div class="home-section-title">ACCEPT</div>
  <div class="home-field">
    <input type="email" value="{{ fields['ACCEPT'] }}" readonly>
  </div>

  <div class="home-section-title">ACCEPT_LANGUAGE</div>
  <div class="home-field">
    <input type="email" value="{{ fields['ACCEPT_LANGUAGE'] }}" readonly>
  </div>

  <div class="home-section-title">ACCEPT_ENCODING</div>
  <div class="home-field">
    <input type="email" value="{{ fields['ACCEPT_ENCODING'] }}" readonly>
  </div>

  <div class="home-section-title">CACHE_CONTROL</div>
  <div class="home-field">
    <input type="email" value="{{ fields['CACHE_CONTROL'] }}" readonly>
  </div>

  <div class="home-section-title">REFERER</div>
  <div class="home-field">
    <input type="email" value="{{ fields['REFERER'] }}" readonly>
  </div>

  <div class="home-section-title">SEC_CH_UA</div>
  <div class="home-field">
    <input type="email" value="{{ fields['SEC_CH_UA'] }}" readonly>
  </div>

  <div class="home-section-title">SEC_CH_UA_MOBILE</div>
  <div class="home-field">
    <input type="email" value="{{ fields['SEC_CH_UA_MOBILE'] }}" readonly>
  </div>

  <div class="home-section-title">SEC_CH_UA_PLATFORM</div>
  <div class="home-field">
    <input type="email" value="{{ fields['SEC_CH_UA_PLATFORM'] }}" readonly>
  </div>

  <hr class="divider">

</div>
{% endblock %}
