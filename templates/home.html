{% extends "base.html" %}

{% block title %}Особистий кабінет{% endblock %}

{% block head %}
<style>
  .home-wrapper {
    max-width: 560px;
    margin: 3rem auto;
    padding: 0 1rem;
  }

  .home-section-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 1rem;
    margin-top: 2rem;
  }

  .home-field {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .home-field input {
    flex: 1;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    padding: 0.55rem 1rem;
    font-size: 0.95rem;
    color: #222;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s;
  }

  .home-field input:focus {
    outline: none;
    border-color: #aaa;
    background: #fff;
  }

  .home-field input[readonly] {
    color: #555;
    cursor: default;
  }

  .home-field .field-btn {
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    background: #f8f8f8;
    color: #444;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    white-space: nowrap;
    transition: background 0.15s;
    cursor: pointer;
  }

  .home-field .field-btn:hover {
    background: #ececec;
    color: #111;
  }

  .email-value {
    font-size: 1rem;
    color: #222;
    font-weight: 500;
  }

  .divider {
    border: none;
    border-top: 1px solid #efefef;
    margin: 2rem 0 0;
  }
</style>
{% endblock %}

{% block content %}
<div class="home-wrapper">

  <!-- Email -->
  <div class="home-section-title">Обліковий запис</div>
  <div class="home-field">
    <input type="email" value="{{ email }}" readonly>
    <button class="field-btn" disabled title="Буде доступно пізніше">Змінити</button>
  </div>

  <hr class="divider">

  <!-- Пароль -->
  <div class="home-section-title">Безпека</div>
  <div class="home-field">
    <input type="password" placeholder="Новий пароль" disabled>
    <button class="field-btn" disabled>Зберегти</button>
  </div>

  <hr class="divider">

  <!-- Особисті дані -->
  <div class="home-section-title">Особисті дані</div>
  <div class="home-field">
    <input type="text" placeholder="Прізвище" disabled>
  </div>
  <div class="home-field">
    <input type="text" placeholder="Ім'я" disabled>
  </div>
  <div class="home-field">
    <input type="text" placeholder="По батькові" disabled>
  </div>

  <hr class="divider">

  <!-- Телефони -->
  <div class="home-section-title">Контакти</div>
  <div class="home-field">
    <input type="tel" placeholder="Телефон основний" disabled>
  </div>
  <div class="home-field">
    <input type="tel" placeholder="Телефон додатковий" disabled>
  </div>

</div>
{% endblock %}
